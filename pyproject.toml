[project]
name = "bookops-bpl-solr"
version = "0.6.1"
description = "BookOps Python wrapper around BPL Solr service."
license = "MIT"
authors = [{name = "Tomasz Kalata", email = "klingaroo@gmail.com"}, {name = "Charlotte Kostelic", email = "charlottekostelic@bookops.org"}]
readme = "README.md"
keywords = ["api", "cataloging", "bibliographic records", "library metadata", "bpl"]
dependencies = ["requests (>=2.24.0,<3)", "types-requests (>=2.28.0,<3)"]
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest (>=8.3.5,<9)", 
    "pytest-cov (>=6.1.0,<7)",
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
	"webtest: marks a test hitting live endpoint",
]
addopts = '-m "not webtest" --cov=bookops_bpl_solr/'

[tool.coverage.run]
relative_files = true
branch = true
source = ["."]
omit = ["tests/*"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
